name: Deploy UI to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'apps/ui/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-ui.yml'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REPOSITORY: my-repo
  SERVICE: ui-service

jobs:
  deploy-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Get API URL
        id: get-api-url
        run: |
          API_URL=$(gcloud run services describe api-service --region ${{ env.REGION }} --format 'value(status.url)')
          echo "API_URL=$API_URL" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          
          # Pass the dynamic API URL as a build argument
          docker build --build-arg VITE_API_URL=${{ env.API_URL }} -t $IMAGE_NAME -f apps/ui/Dockerfile .
          docker push $IMAGE_NAME

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
